name: LunarReg checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check workspace
        run: pnpm typecheck
      - name: Build frontend bundle
        run: pnpm --filter @caffeine/template-frontend build
      - name: Run frontend and backend tests
        run: pnpm test
