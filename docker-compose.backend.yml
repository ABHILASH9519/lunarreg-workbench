services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lunarreg
      POSTGRES_USER: lunarreg
      POSTGRES_PASSWORD: ${LUNARREG_DB_PASSWORD:-local-only-change-me}
    volumes:
      - lunarreg-postgres:/var/lib/postgresql/data
      - ./backend/go/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunarreg -d lunarreg"]
      interval: 5s
      timeout: 3s
      retries: 20
  cv-worker:
    build: ./backend/python
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ./backend/go
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://lunarreg:${LUNARREG_DB_PASSWORD:-local-only-change-me}@db:5432/lunarreg?sslmode=disable
      CV_WORKER_URL: http://cv-worker:8000
      MAX_UPLOAD_BYTES: 104857600
    depends_on:
      db:
        condition: service_healthy
      cv-worker:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  lunarreg-postgres:
