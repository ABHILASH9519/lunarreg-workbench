name: LunarReg checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check workspace
        run: pnpm typecheck
      - name: Build frontend bundle
        run: pnpm --filter @caffeine/template-frontend build
      - name: Run frontend and backend tests
        run: pnpm test

  go-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go/go.mod
      - name: Resolve Go modules
        working-directory: backend/go
        run: go mod tidy
      - name: Test and compile Go API
        working-directory: backend/go
        run: go test ./...

  python-cv-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/python/requirements-dev.txt
      - name: Install CV worker dependencies
        working-directory: backend/python
        run: pip install -r requirements-dev.txt
      - name: Test CV worker
        working-directory: backend/python
        env:
          PYTHONPATH: .
        run: python -m pytest -q
